[package]
name = "specmesh-server"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Authenticated loopback Streamable HTTP MCP server for SpecMesh"
publish = false
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/rust-toolchain.toml",
    "/ci/**",
    "/compatibility/**",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "specmesh-server"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde_json = "1"
specmesh-engine = { path = "../specmesh-engine", version = "=0.0.0" }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
